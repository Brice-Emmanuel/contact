<!DOCTYPE html>
<html lang="fr" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestionnaire de Contacts</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="h-full font-sans antialiased text-slate-800">

    <!-- APP CONTAINER -->
    <div id="app" class="min-h-full flex flex-col">

        <!-- AUTH VIEW (Connexion / Inscription) -->
        <div id="auth-view" class="flex min-h-full flex-col justify-center px-6 py-12 lg:px-8">
            <div class="sm:mx-auto sm:w-full sm:max-w-md bg-white p-8 rounded-2xl shadow-xl border border-slate-100">
                <div class="text-center mb-6">
                    <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-indigo-600 text-white mb-3">
                        <i class="fa-solid fa-address-book text-xl"></i>
                    </div>
                    <h2 id="auth-title" class="text-2xl font-bold tracking-tight text-slate-900">Connexion à votre compte</h2>
                </div>

                <!-- Formulaire Auth -->
                <form id="auth-form" class="space-y-4" onsubmit="handleAuth(event)">
                    <div id="name-field" class="hidden">
                        <label class="block text-sm font-medium text-slate-700">Nom complet</label>
                        <input type="text" id="auth-name" class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2 shadow-sm focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-700">Adresse email</label>
                        <input type="email" id="auth-email" required class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2 shadow-sm focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-700">Mot de passe</label>
                        <input type="password" id="auth-password" required class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2 shadow-sm focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500">
                    </div>

                    <div id="confirm-password-field" class="hidden">
                        <label class="block text-sm font-medium text-slate-700">Confirmer le mot de passe</label>
                        <input type="password" id="auth-password-confirm" class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2 shadow-sm focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500">
                    </div>

                    <button type="submit" id="auth-submit-btn" class="w-full flex justify-center py-2.5 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition">
                        Se connecter
                    </button>
                </form>

                <p class="mt-6 text-center text-sm text-slate-500">
                    <span id="auth-toggle-text">Vous n'avez pas de compte ?</span>
                    <button onclick="toggleAuthMode()" class="font-semibold text-indigo-600 hover:text-indigo-500 ml-1 focus:outline-none" id="auth-toggle-btn">S'inscrire</button>
                </p>
            </div>
        </div>

        <!-- MAIN DASHBOARD VIEW (Masqué par défaut) -->
        <div id="dashboard-view" class="hidden flex-1 flex flex-col">
            
            <!-- Navbar -->
            <header class="bg-white border-b border-slate-200 sticky top-0 z-10">
                <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                    <div class="flex items-center space-x-3">
                        <div class="w-10 h-10 rounded-xl bg-indigo-600 text-white flex items-center justify-center font-bold">
                            <i class="fa-solid fa-address-book"></i>
                        </div>
                        <span class="font-bold text-xl tracking-tight text-slate-900">ContactPro</span>
                    </div>

                    <div class="flex items-center space-x-4">
                        <span id="user-display-name" class="text-sm font-medium text-slate-600"></span>
                        <button onclick="logout()" class="inline-flex items-center gap-2 text-sm text-rose-600 hover:text-rose-700 font-medium px-3 py-1.5 rounded-lg hover:bg-rose-50 transition">
                            <i class="fa-solid fa-arrow-right-from-bracket"></i>
                            Déconnexion
                        </button>
                    </div>
                </div>
            </header>

            <!-- Contenu Principal -->
            <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">

                <!-- Alertes Anniversaires -->
                <div id="birthday-alerts" class="space-y-3"></div>

                <!-- Cards Statistiques -->
                <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                    <div class="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm flex items-center justify-between">
                        <div>
                            <p class="text-sm text-slate-500 font-medium">Total Contacts</p>
                            <h3 id="stat-total" class="text-2xl font-bold text-slate-900 mt-1">0</h3>
                        </div>
                        <div class="w-12 h-12 bg-indigo-50 text-indigo-600 rounded-xl flex items-center justify-center text-xl">
                            <i class="fa-solid fa-users"></i>
                        </div>
                    </div>
                    <div class="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm flex items-center justify-between">
                        <div>
                            <p class="text-sm text-slate-500 font-medium">Favoris</p>
                            <h3 id="stat-favoris" class="text-2xl font-bold text-slate-900 mt-1">0</h3>
                        </div>
                        <div class="w-12 h-12 bg-amber-50 text-amber-500 rounded-xl flex items-center justify-center text-xl">
                            <i class="fa-solid fa-star"></i>
                        </div>
                    </div>
                    <div class="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm flex items-center justify-between">
                        <div>
                            <p class="text-sm text-slate-500 font-medium">Anniversaires ce mois</p>
                            <h3 id="stat-anniv-mois" class="text-2xl font-bold text-slate-900 mt-1">0</h3>
                        </div>
                        <div class="w-12 h-12 bg-emerald-50 text-emerald-600 rounded-xl flex items-center justify-center text-xl">
                            <i class="fa-solid fa-cake-candles"></i>
                        </div>
                    </div>
                    <div class="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm flex items-center justify-between">
                        <div>
                            <p class="text-sm text-slate-500 font-medium">Corbeille</p>
                            <h3 id="stat-supprimes" class="text-2xl font-bold text-slate-900 mt-1">0</h3>
                        </div>
                        <div class="w-12 h-12 bg-rose-50 text-rose-600 rounded-xl flex items-center justify-center text-xl">
                            <i class="fa-solid fa-trash"></i>
                        </div>
                    </div>
                </div>

                <!-- Barre d'actions & Filtres -->
                <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm flex flex-col md:flex-row gap-4 items-center justify-between">
                    <!-- Recherche -->
                    <div class="relative w-full md:w-96">
                        <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                        <input type="text" id="search-input" placeholder="Rechercher par nom, email, téléphone..." oninput="debounceSearch()" class="w-full pl-10 pr-4 py-2 rounded-xl border border-slate-200 text-sm focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500">
                    </div>

                    <!-- Filtres & Ajouter -->
                    <div class="flex items-center gap-3 w-full md:w-auto justify-end">
                        <select id="filter-group" onchange="loadContacts()" class="rounded-xl border border-slate-200 px-3 py-2 text-sm bg-white text-slate-700 focus:outline-none focus:border-indigo-500">
                            <option value="">Tous les groupes</option>
                            <option value="Famille">Famille</option>
                            <option value="Amis">Amis</option>
                            <option value="Collègue">Collègues</option>
                            <option value="Autres">Autres</option>
                        </select>

                        <button onclick="toggleFavoriFilter()" id="btn-filter-fav" class="px-3 py-2 rounded-xl border border-slate-200 text-sm font-medium text-slate-600 hover:bg-slate-50 flex items-center gap-2">
                            <i class="fa-regular fa-star"></i> Favoris
                        </button>

                        <button onclick="openModal()" class="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium transition flex items-center gap-2 shadow-sm shadow-indigo-200">
                            <i class="fa-solid fa-plus"></i> Nouveau contact
                        </button>
                    </div>
                </div>

                <!-- Table des Contacts -->
                <div class="bg-white rounded-2xl border border-slate-100 shadow-sm overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse text-sm">
                            <thead>
                                <tr class="bg-slate-50/50 border-b border-slate-100 text-slate-500 font-medium">
                                    <th class="p-4 w-12"></th>
                                    <th class="p-4">Nom & Prénom</th>
                                    <th class="p-4">Coordonnées</th>
                                    <th class="p-4">Groupe</th>
                                    <th class="p-4">Date de naissance</th>
                                    <th class="p-4 text-right">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="contacts-table-body" class="divide-y divide-slate-100">
                                <!-- Rempli dynamiquement via JS -->
                            </tbody>
                        </table>
                    </div>
                </div>

            </main>
        </div>

        <!-- MODAL CREATION / EDITION -->
        <div id="contact-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
            <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl border border-slate-100 space-y-4">
                <div class="flex justify-between items-center border-b border-slate-100 pb-3">
                    <h3 id="modal-title" class="text-lg font-bold text-slate-900">Ajouter un contact</h3>
                    <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-xl"></i></button>
                </div>

                <form id="contact-form" onsubmit="saveContact(event)" class="space-y-4">
                    <input type="hidden" id="contact-id">
                    
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Nom *</label>
                            <input type="text" id="contact-name" required class="w-full rounded-lg border border-slate-200 p-2.5 text-sm focus:border-indigo-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Prénom *</label>
                            <input type="text" id="contact-surname" required class="w-full rounded-lg border border-slate-200 p-2.5 text-sm focus:border-indigo-500 focus:outline-none">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Email *</label>
                            <input type="email" id="contact-email" required class="w-full rounded-lg border border-slate-200 p-2.5 text-sm focus:border-indigo-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Téléphone *</label>
                            <input type="text" id="contact-phone" required class="w-full rounded-lg border border-slate-200 p-2.5 text-sm focus:border-indigo-500 focus:outline-none">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Groupe *</label>
                            <select id="contact-group" required class="w-full rounded-lg border border-slate-200 p-2.5 text-sm focus:border-indigo-500 focus:outline-none bg-white">
                                <option value="Famille">Famille</option>
                                <option value="Amis">Amis</option>
                                <option value="Collègue">Collègues</option>
                                <option value="Autres">Autres</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Date d'anniversaire</label>
                            <input type="date" id="contact-dob" class="w-full rounded-lg border border-slate-200 p-2.5 text-sm focus:border-indigo-500 focus:outline-none">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Adresse</label>
                        <input type="text" id="contact-address" class="w-full rounded-lg border border-slate-200 p-2.5 text-sm focus:border-indigo-500 focus:outline-none">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Notes</label>
                        <textarea id="contact-notes" rows="2" class="w-full rounded-lg border border-slate-200 p-2.5 text-sm focus:border-indigo-500 focus:outline-none"></textarea>
                    </div>

                    <div class="flex justify-end gap-3 pt-4 border-t border-slate-100">
                        <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-lg text-sm text-slate-600 hover:bg-slate-100">Annuler</button>
                        <button type="submit" class="px-4 py-2 rounded-lg text-sm bg-indigo-600 text-white font-medium hover:bg-indigo-700 transition">Enregistrer</button>
                    </div>
                </form>
            </div>
        </div>

    </div>

    <!-- APP SCRIPT -->
    <script>
        const API_URL = 'http://localhost:8000/api'; // Ajustez l'URL de votre API Laravel
        let isRegisterMode = false;
        let onlyFavoris = false;
        let searchTimeout = null;

        // --- INITIALISATION ---
        document.addEventListener('DOMContentLoaded', () => {
            const token = localStorage.getItem('token');
            if (token) {
                showDashboard();
            } else {
                showAuth();
            }
        });

        // --- EN-TÊTES API ---
        function getHeaders() {
            return {
                'Content-Type': 'application/json',
                'Accept': 'application/json',
                'Authorization': `Bearer ${localStorage.getItem('token')}`
            };
        }

        // --- AUTHENTIFICATION ---
        function toggleAuthMode() {
            isRegisterMode = !isRegisterMode;
            document.getElementById('auth-title').innerText = isRegisterMode ? 'Créer un compte' : 'Connexion à votre compte';
            document.getElementById('name-field').classList.toggle('hidden', !isRegisterMode);
            document.getElementById('confirm-password-field').classList.toggle('hidden', !isRegisterMode);
            document.getElementById('auth-submit-btn').innerText = isRegisterMode ? "S'inscrire" : 'Se connecter';
            document.getElementById('auth-toggle-text').innerText = isRegisterMode ? 'Déjà un compte ?' : "Vous n'avez pas de compte ?";
            document.getElementById('auth-toggle-btn').innerText = isRegisterMode ? 'Se connecter' : "S'inscrire";
        }

        async function handleAuth(e) {
            e.preventDefault();
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            const endpoint = isRegisterMode ? '/register' : '/login';

            const payload = { email, password };
            if (isRegisterMode) {
                payload.name = document.getElementById('auth-name').value;
                payload.password_confirmation = document.getElementById('auth-password-confirm').value;
            }

            try {
                const res = await fetch(`${API_URL}${endpoint}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();

                if (res.ok) {
                    localStorage.setItem('token', data.data.token);
                    localStorage.setItem('user', JSON.stringify(data.data.user));
                    showDashboard();
                } else {
                    alert(data.message || 'Erreur lors de l\'authentification');
                }
            } catch (err) {
                console.error(err);
                alert('Impossible de contacter le serveur.');
            }
        }

        function logout() {
            fetch(`${API_URL}/logout`, { method: 'POST', headers: getHeaders() })
                .finally(() => {
                    localStorage.clear();
                    showAuth();
                });
        }

        function showAuth() {
            document.getElementById('auth-view').classList.remove('hidden');
            document.getElementById('dashboard-view').classList.add('hidden');
        }

        function showDashboard() {
            document.getElementById('auth-view').classList.add('hidden');
            document.getElementById('dashboard-view').classList.remove('hidden');
            
            const user = JSON.parse(localStorage.getItem('user') || '{}');
            document.getElementById('user-display-name').innerText = user.name || 'Utilisateur';

            loadStats();
            loadBirthdays();
            loadContacts();
        }

        // --- DASHBOARD & STATS ---
        async function loadStats() {
            try {
                const res = await fetch(`${API_URL}/contacts/statistiques`, { headers: getHeaders() });
                const json = await res.json();
                if (json.succes) {
                    document.getElementById('stat-total').innerText = json.data.total;
                    document.getElementById('stat-favoris').innerText = json.data.favoris;
                    document.getElementById('stat-anniv-mois').innerText = json.data.anniversaire_mois;
                    document.getElementById('stat-supprimes').innerText = json.data.supprimes;
                }
            } catch (e) { console.error(e); }
        }

        async function loadBirthdays() {
            const container = document.getElementById('birthday-alerts');
            container.innerHTML = '';

            // Aujourd'hui
            try {
                const res = await fetch(`${API_URL}/contacts/anniversaire`, { headers: getHeaders() });
                if (res.ok) {
                    const json = await res.json();
                    json.data.forEach(c => {
                        container.innerHTML += `
                            <div class="p-4 rounded-xl bg-amber-50 border border-amber-200 text-amber-800 flex items-center gap-3">
                                <i class="fa-solid fa-cake-candles text-xl text-amber-500"></i>
                                <div><strong>Aujourd'hui :</strong> ${c.message} (${c.phone})</div>
                            </div>`;
                    });
                }
            } catch (e) {}

            // Prévus dans 7 jours
            try {
                const resPrev = await fetch(`${API_URL}/contacts/anniversaire_prevu`, { headers: getHeaders() });
                if (resPrev.ok) {
                    const jsonPrev = await resPrev.json();
                    jsonPrev.data.forEach(c => {
                        container.innerHTML += `
                            <div class="p-4 rounded-xl bg-indigo-50 border border-indigo-200 text-indigo-800 flex items-center gap-3">
                                <i class="fa-solid fa-bell text-xl text-indigo-500"></i>
                                <div><strong>Dans 7 jours :</strong> ${c.message}</div>
                            </div>`;
                    });
                }
            } catch (e) {}
        }

        // --- GESTION DES CONTACTS ---
        async function loadContacts() {
            const group = document.getElementById('filter-group').value;
            const search = document.getElementById('search-input').value;

            let url = new URL(`${API_URL}/contacts`);
            if (group) url.searchParams.append('groupe', group);
            if (onlyFavoris) url.searchParams.append('favoris', '1');
            if (search) url.searchParams.append('recherche', search);

            try {
                const res = await fetch(url, { headers: getHeaders() });
                const json = await res.json();
                renderContacts(json.data.data || json.data);
            } catch (e) { console.error(e); }
        }

        function renderContacts(contacts) {
            const tbody = document.getElementById('contacts-table-body');
            tbody.innerHTML = '';

            if (!contacts || contacts.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="text-center p-8 text-slate-400">Aucun contact trouvé.</td></tr>`;
                return;
            }

            contacts.forEach(c => {
                const badgeColors = {
                    'Famille': 'bg-purple-50 text-purple-700 border-purple-100',
                    'Amis': 'bg-blue-50 text-blue-700 border-blue-100',
                    'Collègue': 'bg-emerald-50 text-emerald-700 border-emerald-100',
                    'Autres': 'bg-slate-50 text-slate-700 border-slate-100'
                };

                tbody.innerHTML += `
                    <tr class="hover:bg-slate-50/80 transition">
                        <td class="p-4 text-center">
                            <button onclick="toggleFavori(${c.id})" class="text-slate-300 hover:text-amber-400 ${c.favoris ? 'text-amber-400' : ''}">
                                <i class="fa-${c.favoris ? 'solid' : 'regular'} fa-star text-base"></i>
                            </button>
                        </td>
                        <td class="p-4 font-semibold text-slate-900">${c.surname} ${c.name}</td>
                        <td class="p-4 space-y-0.5">
                            <div class="text-slate-600"><i class="fa-regular fa-envelope text-xs mr-1 text-slate-400"></i>${c.email}</div>
                            <div class="text-xs text-slate-400"><i class="fa-solid fa-phone text-xs mr-1 text-slate-400"></i>${c.phone}</div>
                        </td>
                        <td class="p-4">
                            <span class="px-2.5 py-1 rounded-full text-xs font-medium border ${badgeColors[c.group] || badgeColors['Autres']}">${c.group}</span>
                        </td>
                        <td class="p-4 text-slate-500">${c.date_birth || '-'}</td>
                        <td class="p-4 text-right space-x-2">
                            <button onclick="editContact(${c.id})" class="p-2 text-slate-400 hover:text-indigo-600 rounded-lg hover:bg-slate-100"><i class="fa-solid fa-pen"></i></button>
                            <button onclick="deleteContact(${c.id})" class="p-2 text-slate-400 hover:text-rose-600 rounded-lg hover:bg-slate-100"><i class="fa-solid fa-trash"></i></button>
                        </td>
                    </tr>
                `;
            });
        }

        // --- ACTIONS CRUD ---
        async function saveContact(e) {
            e.preventDefault();
            const id = document.getElementById('contact-id').value;
            const payload = {
                name: document.getElementById('contact-name').value,
                surname: document.getElementById('contact-surname').value,
                email: document.getElementById('contact-email').value,
                phone: document.getElementById('contact-phone').value,
                group: document.getElementById('contact-group').value,
                date_birth: document.getElementById('contact-dob').value || null,
                adress: document.getElementById('contact-address').value || null,
                notes: document.getElementById('contact-notes').value || null,
            };

            const method = id ? 'PUT' : 'POST';
            const endpoint = id ? `/contacts/${id}` : '/contacts';

            try {
                const res = await fetch(`${API_URL}${endpoint}`, {
                    method,
                    headers: getHeaders(),
                    body: JSON.stringify(payload)
                });

                if (res.ok) {
                    closeModal();
                    loadContacts();
                    loadStats();
                } else {
                    const err = await res.json();
                    alert(err.message || 'Erreur lors de la sauvegarde');
                }
            } catch (e) { console.error(e); }
        }

        async function editContact(id) {
            try {
                const res = await fetch(`${API_URL}/contacts/${id}/edit`, { headers: getHeaders() });
                const json = await res.json();
                const c = json.data;

                document.getElementById('contact-id').value = c.id;
                document.getElementById('contact-name').value = c.name;
                document.getElementById('contact-surname').value = c.surname;
                document.getElementById('contact-email').value = c.email;
                document.getElementById('contact-phone').value = c.phone;
                document.getElementById('contact-group').value = c.group;
                document.getElementById('contact-dob').value = c.date_birth || '';
                document.getElementById('contact-address').value = c.adress || '';
                document.getElementById('contact-notes').value = c.notes || '';

                openModal(true);
            } catch (e) { console.error(e); }
        }

        async function toggleFavori(id) {
            try {
                await fetch(`${API_URL}/contacts/${id}/favoris`, { method: 'POST', headers: getHeaders() });
                loadContacts();
                loadStats();
            } catch (e) { console.error(e); }
        }

        async function deleteContact(id) {
            if (!confirm('Voulez-vous vraiment supprimer ce contact ?')) return;
            try {
                await fetch(`${API_URL}/contacts/${id}`, { method: 'DELETE', headers: getHeaders() });
                loadContacts();
                loadStats();
            } catch (e) { console.error(e); }
        }

        // --- UTILS / MODAL ---
        function openModal(isEdit = false) {
            document.getElementById('modal-title').innerText = isEdit ? 'Modifier le contact' : 'Ajouter un contact';
            if (!isEdit) document.getElementById('contact-form').reset();
            document.getElementById('contact-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('contact-modal').classList.add('hidden');
            document.getElementById('contact-id').value = '';
        }

        function toggleFavoriFilter() {
            onlyFavoris = !onlyFavoris;
            const btn = document.getElementById('btn-filter-fav');
            btn.classList.toggle('bg-amber-50', onlyFavoris);
            btn.classList.toggle('border-amber-200', onlyFavoris);
            btn.classList.toggle('text-amber-600', onlyFavoris);
            loadContacts();
        }

        function debounceSearch() {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(loadContacts, 300);
        }
    </script>
</body>
</html>
